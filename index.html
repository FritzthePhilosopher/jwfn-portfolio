    <!-- Apply a saved dark theme before the app loads, so there's no white flash. -->
    <style>html[data-mui-color-scheme="dark"]{background:#16100E;color-scheme:dark}</style>
    <script>
      try {
        var m = localStorage.getItem('mui-mode');
        if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mui-color-scheme', m === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
